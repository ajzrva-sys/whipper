name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libsndfile1-dev -> accuraterip C extension; libdiscid-dev -> discid
          sudo apt-get install -y cd-paranoia cdrdao flac libdiscid-dev \
            libsndfile1-dev sox

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 twisted -r requirements.txt

      - name: Install whipper
        run: pip install .

      - name: Run unit tests
        run: python -m unittest discover

      - name: Lint
        run: flake8 -j 1
